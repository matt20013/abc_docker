name: Test Action
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      # Test 1: Single file processing (HEAD)
      - name: Run Action (Single File)
        uses: ./
        with:
          abc_dir: 'test_data/abcs'
          file_name: 'test_tune'
          pdf_dir: 'test_data/pdfs'
          mp3_dir: 'test_data/mp3s'
          csv_dir: 'test_data/csvs'
      - name: Verify Output (Single File)
        run: |
          ls -R test_data
          test -f test_data/pdfs/test_tune.pdf
          # Check for MP3 (file structure might vary based on script logic)
          find test_data/mp3s -name "*.mp3"
          test -f test_data/csvs/test_tune.csv

      # Test 2: Batch processing (Master)
      - name: Create Batch Test Data
        run: |
          mkdir -p batch_abcs
          echo "X:1" > batch_abcs/batch_test.abc
          echo "T:Batch Test Tune" >> batch_abcs/batch_test.abc
          echo "M:4/4" >> batch_abcs/batch_test.abc
          echo "L:1/4" >> batch_abcs/batch_test.abc
          echo "K:C" >> batch_abcs/batch_test.abc
          echo "CDEF|GABc|]" >> batch_abcs/batch_test.abc
      - name: Run Action (Batch)
        uses: ./
        with:
          abc_dir: 'batch_abcs'
          pdf_dir: 'batch_pdfs'
          mp3_dir: 'batch_mp3s'
          csv_dir: 'batch_csvs'
      - name: Verify Output (Batch)
        run: |
          ls -R batch_pdfs batch_mp3s batch_csvs
          test -f batch_pdfs/batch_test.pdf
          test -f batch_mp3s/batch_test/001-Batch_Test_Tune.mp3
          test -f batch_csvs/batch_test.csv

name: Test Action
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      # Test 1: Single file processing (HEAD)
      - name: Run Action (Single File)
        uses: ./
        with:
          abc_dir: 'test_data/abcs'
          file_name: 'test_tune'
      - name: Verify Output (Single File)
        run: |
          ls -R test_data
          ls -R pdfs
          ls -R mp3s
          test -f pdfs/test_tune.pdf
          # Check for MP3 (file structure might vary based on script logic)
          find mp3s -name "*.mp3"

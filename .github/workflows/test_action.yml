name: Test Action
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Run Action
        uses: ./
        with:
          abc_dir: 'test_data/abcs'
          file_name: 'test_tune'
          pdf_dir: 'test_data/pdfs'
          mp3_dir: 'test_data/mp3s'
          csv_dir: 'test_data/csvs'
      - name: Verify Output
        run: |
          ls -R test_data
          test -f test_data/pdfs/test_tune.pdf
          test -f test_data/mp3s/test_tune/*.mp3 || test -f test_data/mp3s/test_tune.mp3
          test -f test_data/csvs/test_tune.csv

name: Docker CI Integration Test

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]

jobs:
  test-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Pull latest ABC Docker Engine
        run: docker pull ghcr.io/matt20013/abc_docker:latest

      - name: Setup output directories
        run: |
          mkdir -p test_data/pdfs test_data/mp3s test_data/midi
          # Ensure test data exists (in case moving/git checkout was partial in CI)
          # ls -R test_data

      - name: Test PDF Generation
        run: |
          docker run --rm \
          -v ${{ github.workspace }}/test_data/abcs:/abcs \
          -v ${{ github.workspace }}/test_data/pdfs:/pdfs \
          --env ABC_FILENAME=test_tune \
          --env ABC_DIR=/abcs \
          --env PDF_DIR=/pdfs \
          ghcr.io/matt20013/abc_docker:latest /scripts/create_pdf.sh

          # Assert the PDF was actually created
          test -f test_data/pdfs/test_tune.pdf || { echo "PDF generation failed!"; exit 1; }

      - name: Test MP3 Generation
        run: |
          docker run --rm \
          -v ${{ github.workspace }}/test_data/abcs:/abcs \
          -v ${{ github.workspace }}/test_data/mp3s:/mp3s \
          ghcr.io/matt20013/abc_docker:latest python3 /scripts/generate_mp3.py /abcs/test_tune.abc /mp3s

          # Assert at least one MP3 was created
          ls test_data/mp3s/test_tune/*.mp3 >/dev/null 2>&1 || { echo "MP3 generation failed!"; exit 1; }

      - name: Integration Test Passed
        run: echo "✅ All media files generated successfully!"
